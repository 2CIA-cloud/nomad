<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AZIMUTE</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg-base: #0a0a0a;
      --bg-surface: #121212;
      --bg-elevated: #181818;
      --border-subtle: #242424;
      --border-focus: #383838;
      --khaki-primary: #c5b358;
      --khaki-muted: #8b7d3a;
      --khaki-dim: rgba(197, 179, 88, 0.12);
      --text-main: #f0f0f0;
      --text-secondary: #9e9e9e;
      --text-muted: #666666;
      --status-ok: #2e7d32;
      --status-warn: #d97706;
      --status-alert: #dc2626;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.4;
      padding-bottom: 76px;
      overflow-x: hidden;
    }

    /* TOPBAR FIXA E TELEMETRIA COMPACTA */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(10, 10, 10, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 10px 14px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-mark {
      width: 8px;
      height: 18px;
      background-color: var(--khaki-primary);
      border-radius: 1px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--text-main);
    }

    .brand-version {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--khaki-primary);
      background: var(--khaki-dim);
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid rgba(197, 179, 88, 0.25);
    }

    .section-indicator {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* BARRA DE TELEMETRIA (GPS + CLIMA) */
    .telemetry-bar {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .telemetry-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .qth-box {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--text-muted);
      flex-shrink: 0;
    }

    .status-dot.active {
      background-color: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
    }

    .qth-text {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .qth-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-gps-toggle {
      background-color: var(--bg-elevated);
      color: var(--khaki-primary);
      border: 1px solid var(--khaki-muted);
      border-radius: 4px;
      padding: 4px 8px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      text-transform: uppercase;
    }

    .btn-gps-toggle.active {
      background-color: var(--khaki-primary);
      color: #000;
      border-color: var(--khaki-primary);
    }

    .weather-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-subtle);
      padding-top: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
    }

    .rain-badge {
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      background-color: var(--bg-elevated);
      color: var(--text-secondary);
    }

    .rain-badge.alert {
      background-color: rgba(220, 38, 38, 0.2);
      color: #f87171;
      border: 1px solid rgba(220, 38, 38, 0.4);
    }

    /* BUSCA GLOBAL (OMNIBOX) */
    .search-wrap {
      padding: 10px 14px 4px;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      width: 16px;
      height: 16px;
      color: var(--text-muted);
    }

    .search-input {
      width: 100%;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 10px 34px 10px 36px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--khaki-muted);
    }

    .search-clear {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 16px;
      cursor: pointer;
      display: none;
    }

    /* ESTRUTURA DE TELAS / ABAS */
    .main-container {
      padding: 10px 14px;
    }

    .tab-view {
      display: none;
    }

    .tab-view.active {
      display: block;
    }

    /* TÍTULOS DE SEÇÃO */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 14px 0 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .section-header:first-child {
      margin-top: 4px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--khaki-primary);
    }

    .section-meta {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
    }

    /* CARDS SÓBRIOS */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tactical-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--khaki-muted);
      border-radius: 5px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tactical-card.alert-card {
      border-left-color: var(--status-alert);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }

    .card-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--khaki-primary);
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      padding: 2px 6px;
      border-radius: 3px;
      white-space: nowrap;
    }

    .card-desc {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background-color: var(--bg-elevated);
      color: var(--text-main);
      border: 1px solid var(--border-focus);
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .btn-action:active {
      border-color: var(--khaki-primary);
      color: var(--khaki-primary);
    }

    .btn-action svg {
      width: 13px;
      height: 13px;
      color: var(--khaki-primary);
    }

    /* GRADE DE SISTEMAS / ATALHOS (2 COLUNAS PADRONIZADAS) */
    .systems-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .sys-btn {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 5px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 64px;
      text-decoration: none;
      color: var(--text-main);
      cursor: pointer;
      text-align: left;
    }

    .sys-btn:active {
      border-color: var(--khaki-primary);
      background-color: var(--bg-elevated);
    }

    .sys-btn-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 4px;
    }

    .sys-btn-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: var(--text-main);
    }

    .sys-btn-sub {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-secondary);
    }

    /* SUB-ABAS INTERNAS (18º BPM) */
    .subnav-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }

    .subnav-scroll::-webkit-scrollbar {
      display: none;
    }

    .subnav-pill {
      background-color: var(--bg-surface);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .subnav-pill.active {
      background-color: var(--khaki-dim);
      color: var(--khaki-primary);
      border-color: var(--khaki-primary);
    }

    .sub-panel {
      display: none;
    }

    .sub-panel.active {
      display: block;
    }

    /* FORMULÁRIO E LOG DE DRONE / BLOCO DE NOTAS */
    .tactical-textarea, .tactical-input {
      width: 100%;
      background-color: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 8px 10px;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 12px;
      margin-bottom: 8px;
      outline: none;
    }

    .tactical-textarea:focus, .tactical-input:focus {
      border-color: var(--khaki-muted);
    }

    /* RODAPÉ FIXO DE NAVEGAÇÃO */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 62px;
      background-color: #0c0c0c;
      border-top: 1px solid var(--border-subtle);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 200;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      position: relative;
    }

    .nav-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
    }

    .nav-btn span {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .nav-btn.active {
      color: var(--khaki-primary);
    }

    .nav-btn.active::before {
      content: "";
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 2px;
      background-color: var(--khaki-primary);
    }

    /* MODAL CÓDIGO Q / IMEI */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-focus);
      border-top: 3px solid var(--khaki-primary);
      border-radius: 6px;
      width: 100%;
      max-width: 420px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 16px;
    }
  </style>
</head>
<body>

  <!-- TOPBAR E TELEMETRIA COMPACTA -->
  <header class="app-header">
    <div class="header-top">
      <div class="brand">
        <div class="brand-mark"></div>
        <span class="brand-title">AZIMUTE</span>
        <span class="brand-version">v2.0.1</span>
      </div>
      <span class="section-indicator" id="headerSectionLabel">PAINEL TÁTICO</span>
    </div>

    <div class="telemetry-bar">
      <div class="telemetry-row">
        <div class="qth-box">
          <span class="status-dot" id="gpsStatusDot"></span>
          <div style="min-width:0; flex:1;">
            <div class="qth-text" id="qthStreet">GPS INATIVO — TOQUE EM ATIVAR QTH</div>
            <div class="qth-sub">
              <span id="qthNeighborhood">RMBH / MG</span>
              <span>•</span>
              <span id="qthCoords">--.-----, --.-----</span>
            </div>
          </div>
        </div>
        <button class="btn-gps-toggle" id="btnToggleGps" onclick="toggleGPS()">ATIVAR QTH</button>
      </div>

      <div class="weather-strip">
        <span id="weatherInfo">CLIMA RMBH: CARREGANDO...</span>
        <span class="rain-badge" id="rainAlertBadge">MONITORANDO CHUVA</span>
      </div>
    </div>
  </header>

  <!-- BUSCA OMNIBOX -->
  <div class="search-wrap">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="omniboxInput" class="search-input" placeholder="Filtrar unidade, cia, hospital, estádio ou sistema..." oninput="filterOmnibox()" />
      <button class="search-clear" id="btnClearSearch" onclick="clearOmnibox()">×</button>
    </div>
  </div>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="main-container" id="mainContent">

    <!-- ABA 1: INÍCIO -->
    <section id="view-inicio" class="tab-view active">
      <div class="section-header">
        <span class="section-title">Acesso Rápido Operacional</span>
        <span class="section-meta">RMBH</span>
      </div>

      <div class="systems-grid">
        <a href="https://web.sids.mg.gov.br/reds" target="_blank" rel="noopener" class="sys-btn searchable">
          <div class="sys-btn-top">
            <span class="sys-btn-title">REDS</span>
            <span class="card-tag">SIDS</span>
          </div>
          <span class="sys-btn-sub">Registro de Eventos</span>
        </a>

        <a href="https://portalbnmp.cnj.jus.br/" target="_blank" rel="noopener" class="sys-btn searchable">
          <div class="sys-btn-top">
            <span class="sys-btn-title">BNMP</span>
            <span class="card-tag">MANDADOS</span>
          </div>
          <span class="sys-btn-sub">Consulta Nacional CNJ</span>
        </a>

        <div onclick="openImeiModal()" class="sys-btn searchable">
          <div class="sys-btn-top">
            <span class="sys-btn-title">CONSULTAR IMEI</span>
            <span class="card-tag">ANATEL</span>
          </div>
          <span class="sys-btn-sub">Verificar Impedimento</span>
        </div>

        <a href="
